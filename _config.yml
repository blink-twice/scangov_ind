title: ScanGov India
description: Government digital experience monitor
url: https://blink-twice.github.io/scangov_ind/
org: blink-twice
org-url: 
repo: https://github.com/blink-twice/scangov_ind
rss: 

website: https://blink-twice.github.io/scangov_ind
basewebsite: https://blink-twice.github.io/scangov_ind
# Build settings
plugins:
  - jekyll-feed
  - jekyll-sitemap
  
# Social

github-url: https://github.com/blink-twice
linkedin-url: 
twitter-url: 

twitter-username: 
twitter: 

# Date/time
date: "%B %-d, %Y"
timezone: America/Los_Angeles

# Collections
collections:
  pages:
    output: true
    permalink: :title

# Defaults
defaults:
  - scope:
      path: "_pages"
      type: "pages"
    values:
      layout: "page"
      parent: ""
      short: "true"

# Exclude
exclude:
  - gemfiles/
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - README.md
  - CNAME
